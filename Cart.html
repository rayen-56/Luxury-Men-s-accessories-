<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Men's Accessories - Cart</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* Flexbox layout for body to keep footer at the bottom */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
        }

        /* Footer styling to ensure it stays at the bottom */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: auto; /* Pushes footer to bottom */
        }
    </style>
</head>
<body>

    <!-- Main content wrapper -->
    <div class="main-content">
        <!-- Header Section -->
        <header>
            <div class="container">
                <div class="logo">
                    <h1>Luxury Men's Accessories</h1>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                        <li><a href="shop.html"><i class="fas fa-shopping-cart"></i> Shop</a></li>
                        <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
                        <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
                        <li><a href="cart.html"><i class="fas fa-shopping-bag"></i>Cart</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Cart Section -->
        <section class="cart">
            <div class="container">
                <h2>Your Shopping Cart</h2>
                <div class="cart-items">
                    <!-- Cart items will be dynamically added here -->
                </div>
                <div class="cart-total">
                    <h3>Total: $0</h3>
                    <button class="btn checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer Section -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Luxury Men's Accessories. All rights reserved.</p>
            <div class="social">
                <a href="https://www.instagram.com/accessories_25_8/">Instagram</a>
                <a href="#">Facebook</a>
            </div>
        </div>
    </footer>

    <!-- Script to dynamically load cart items from localStorage -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function renderCart() {
                const cartItemsContainer = document.querySelector('.cart-items');
                const cart = JSON.parse(localStorage.getItem('cart')) || [];

                cartItemsContainer.innerHTML = '';

                if (cart.length === 0) {
                    cartItemsContainer.innerHTML = '<p>Your cart is empty</p>';
                    document.querySelector('.cart-total h3').innerText = 'Total: $0';
                    return;
                }

                let totalPrice = 0;
                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.quantity;
                    totalPrice += itemTotal;

                    const cartItem = document.createElement('div');
                    cartItem.classList.add('cart-item');
                    cartItem.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <p>Price: $${item.price.toFixed(2)}</p>
                            <label for="quantity-${index}">Quantity:</label>
                            <input type="number" id="quantity-${index}" value="${item.quantity}" min="1" onchange="updateQuantity(${index}, this.value)">
                            <button class="btn remove-btn" onclick="removeFromCart(${index})">Remove</button>
                        </div>
                    `;
                    cartItemsContainer.appendChild(cartItem);
                });

                document.querySelector('.cart-total h3').innerText = `Total: $${totalPrice.toFixed(2)}`;
            }

            window.updateQuantity = function(index, quantity) {
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                if (quantity <= 0) {
                    cart.splice(index, 1); // Remove item if quantity is zero
                } else {
                    cart[index].quantity = parseInt(quantity); // Update quantity
                }
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            };

            window.removeFromCart = function(index) {
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                cart.splice(index, 1); // Remove the item
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            };

            // Proceed to Checkout
            window.proceedToCheckout = function() {
                // Save the current cart to localStorage under a different key for checkout
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                localStorage.setItem('checkoutCart', JSON.stringify(cart));
                
                // Clear the cart display
                localStorage.removeItem('cart'); // Remove the cart from localStorage
                renderCart(); // Update display

                // Redirect to the checkout page
                window.location.href = 'chekout.html';
            };

            // Initial render
            renderCart();
        });
    </script>

</body>
</html>
