<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Men's Accessories - Shop</title>
    <!-- Missing closing bracket added here -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="container">
            <div class="logo">
                <h1>Luxury Men's Accessories</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="shop.html"><i class="fas fa-shopping-cart"></i> Shop</a></li>
                    <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
                    <li><a href="contact.html"><i class="fas fa-envelope"></i> Contact</a></li>
                    <li><a href="cart.html"><i class="fas fa-shopping-bag"></i> Cart (0)</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Shop Section -->
    <section class="shop">
        <div class="container">
            <h2>Shop Our Collection</h2>
            <div class="product-grid">
                <div class="product">
                    <img src="watch.jpg" alt="Luxury Watch">
                    <div class="product-info">
                        <h3>mongela</h3>
                        <p>$199.99</p>
                        <a href="#" class="btn">Add to Cart</a>
                    </div>
                </div>
                <div class="product">
                    <img src="wallet.jpg" alt="Leather Wallet">
                    <div class="product-info">
                        <h3>stouch</h3>
                        <p>$89.99</p>
                        <a href="Cart.html" class="btn">Add to Cart</a>
                    </div>
                </div>
                <div class="product">
                    <img src="sunglasses.jpg" alt="Designer Sunglasses">
                    <div class="product-info">
                        <h3>lunette</h3>
                        <p>$149.99</p>
                        <a href="#" class="btn">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Section -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Luxury Men's Accessories. All rights reserved.</p>
            <div class="social">
                <a href="https://www.instagram.com/accessories_25_8/">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">Twitter</a> <!-- Fixed the tag here -->
            </div> <div class="language-selection">
            <label for="language-selector">Change Language:</label>
            <select id="language-selector" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="Tn">Tounsi</option>
                <!-- Add more languages as needed -->
            </select>
        </div>
        </div>
    </footer>
<script>
        function changeLanguage() {
            const languageSelector = document.getElementById('language-selector');
            const selectedLanguage = languageSelector.value;

            // Redirect to the corresponding language page
            if (selectedLanguage === 'fr') {
                window.location.href = 'fr-Shop.html'; // Example for French home page
            } else if (selectedLanguage === 'Tn') {
                window.location.href = 'Tn-Shop.html'; // Example for tunisian home page
            } else {
                window.location.href = 'Shop.html'; // Default to English
            }
        }
        
        // Function to set the selected language on page load
    function setLanguageOnLoad() {
        const languageSelector = document.getElementById('language-selector');
        const savedLanguage = localStorage.getItem('selectedLanguage') || 'Tn'; // Default to English if not set
        languageSelector.value = savedLanguage; // Set the dropdown to the saved language
    }

    // Call the setLanguageOnLoad function when the page loads
    window.onload = setLanguageOnLoad;
</script>
    </script>
</body>
</html>
