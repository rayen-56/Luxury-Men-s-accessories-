<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Luxury Men's Accessories</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        /* Flexbox layout for body to keep footer at the bottom */
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
        }

        /* Footer styling to ensure it stays at the bottom */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: auto; /* Pushes footer to bottom */
        }
    </style>
</head>
<body>

    <!-- Main content wrapper -->
    <div class="main-content">
        <!-- Header Section -->
        <header>
            <div class="container">
                <div class="logo">
                    <h1>Luxury Men's Accessories</h1>
                </div>
            </div>
        </header>

        <!-- Checkout Section -->
        <section class="checkout">
            <div class="container">
                <h2>Checkout</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone:</label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required title="Please enter a 10-digit phone number" placeholder="1234567890">
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address:</label>
                        <textarea id="address" name="address" required></textarea>
                    </div>

                    <button type="submit" class="btn">Submit</button>
                </form>
            </div>
        </section>
    </div>

    <!-- Footer Section -->
    <footer>
        <div class="container">
            <p>&copy; 2024 Luxury Men's Accessories. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const checkoutForm = document.getElementById('checkout-form');
            
            checkoutForm.addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent form from submitting the traditional way

                // Collect user input from the form
                const checkoutDetails = {
                    firstName: document.getElementById('first-name').value,
                    lastName: document.getElementById('last-name').value,
                    phone: document.getElementById('phone').value,
                    email: document.getElementById('email').value,
                    address: document.getElementById('address').value,
                };

                // Save user details to localStorage
                localStorage.setItem('checkoutDetails', JSON.stringify(checkoutDetails));

                // Redirect to the confirmation page
                window.location.href = 'confirmation.html';
            });
        });
    </script>

</body>
</html>
