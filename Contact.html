<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Men's Accessories - Contact</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-content">
    <!-- Contact Section -->
    <section class="contact">
        <div class="container">
            <h2>Contact Us</h2>
            <form onsubmit="saveMessage(event)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="instagram">Instagram</label>
                    <input type="text" id="instagram" name="instagram" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>
</div>

<script>
    function saveMessage(event) {
        event.preventDefault(); // Prevent page reload

        // Get form values
        const name = document.getElementById('name').value;
        const instagram = document.getElementById('instagram').value;
        const message = document.getElementById('message').value;

        // Retrieve existing messages from localStorage or initialize an empty array
        const messages = JSON.parse(localStorage.getItem('contactMessages')) || [];

        // Add new message to array
        messages.push({ name, instagram, message });

        // Save updated messages array to localStorage
        localStorage.setItem('contactMessages', JSON.stringify(messages));

        // Display success message or reset form as desired
        alert('Message sent successfully!');
        document.querySelector("form").reset();
    }
</script>

</body>
</html>
